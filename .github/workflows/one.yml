name: Add File to Repository

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  # Or trigger automatically on push:
  # push:
  #   branches: [ main ]

permissions:
  contents: write # Required to push commits back to the repo

jobs:
  add-content:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create or modify your file(s)
      - name: Create new file
        run: |
          mkdir -p docs
          echo "Generated on $(date)" > docs/auto-generated.txt

      # 3. Commit and push the changes
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # Only commit if there are actual changes to avoid workflow errors
          if ! git diff --staged --quiet; then
            git commit -m "chore: add auto-generated file"
            git push
          else
            echo "No changes to commit."
          fi
