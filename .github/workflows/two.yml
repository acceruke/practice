name: Scaffold Expo App & Build APK

on:
  workflow_dispatch: # Manually triggered from the Actions tab

permissions:
  contents: write # Needed to save the generated Expo files to your repo

jobs:
  scaffold-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js and Java 17
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Scaffold Expo project ONLY if package.json doesn't exist yet
      - name: Initialize Expo Project (First Run Only)
        if: ${{ hashFiles('package.json') == '' }}
        run: |
          npx --yes create-expo-app@latest temp-app --yes
          shopt -s dotglob
          mv temp-app/* .
          rmdir temp-app

          # Inject android.package into app.json so prebuild doesn't fail
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.android.package = "com.myorg.myapp";
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
          '

          # Ensure android/, ios/, and APKs are excluded from Git
          printf "\n# Native & build outputs\nandroid/\nios/\n*.apk\n" >> .gitignore

          # Commit the clean source files back to the repository
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: scaffold initial Expo React Native project"
          git push

      # 4. Install dependencies for builds
      - name: Install npm dependencies
        run: npm ci

      # 5. Generate native android/ folder on the runner (not saved to repo)
      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean

      # 6. Compile the Debug APK
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload the APK as a downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
