name: Scaffold Expo App & Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js and Java 17
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Scaffold Expo project ONLY if package.json does not exist yet
      - name: Initialize Expo Project (First Run Only)
        if: ${{ hashFiles('package.json') == '' }}
        run: |
          npx --yes create-expo-app@latest temp-app --yes
          shopt -s dotglob
          mv temp-app/* .
          rmdir temp-app

          # Inject android.package into app.json so prebuild succeeds non-interactively
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.android.package = "com.myorg.myapp";
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
          '

          # Keep native build folders and APKs out of Git
          printf "\n# Native & build outputs\nandroid/\nios/\n*.apk\n" >> .gitignore

          # Push the scaffolded Expo source folders back to the repository
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: scaffold initial Expo React Native project"
          git push

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Generate the native android/ project on the runner
      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean

      # 6. Compile the standalone Release APK
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 7. Upload the Release APK as a downloadable Artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
